[build]
  publish = "."
  functions = "netlify/functions"

# Domínio secundário aponta para o principal
[[redirects]]
  from = "https://cartaooupix.com.br/*"
  to = "https://pixoucartao.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cartaooupix.com.br/*"
  to = "https://pixoucartao.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Scripts de apoio aos artigos não são publicados
[[redirects]]
  from = "/ferramentas/*"
  to = "/404.html"
  status = 404
  force = true
